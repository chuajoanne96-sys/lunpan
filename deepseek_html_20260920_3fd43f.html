<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>亲子养生 · 幸运轮盘</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh;
    background: #f7f1e3;
    font-family: "Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    color: #4a3520;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  h1 {
    font-size: clamp(20px, 5vw, 32px);
    margin: 10px 0 6px; letter-spacing: 3px; text-align: center;
    padding: 0 12px;
  }
  .wheel-wrap {
    position: relative;
    width: min(92vw, 92vh, 680px);
    aspect-ratio: 1/1; margin: 0 auto; touch-action: none;
  }
  #wheel {
    width: 100%; height: 100%; display: block;
    border-radius: 50%;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    transition: transform .04s linear;
    will-change: transform;
  }
  .pointer {
    position: absolute; top: -6px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: clamp(12px,2.8vw,22px) solid transparent;
    border-right: clamp(12px,2.8vw,22px) solid transparent;
    border-top: clamp(24px,5.5vw,42px) solid #d94f4f;
    z-index: 3;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.25));
    pointer-events: none;
  }
  .center-btn {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    width: 22%; aspect-ratio: 1/1;
    border-radius: 50%;
    border: clamp(3px,.8vw,6px) solid #fff;
    background: #ffd97a; color: #5a3a12;
    font-size: clamp(12px,2.6vw,20px); font-weight: 700;
    cursor: pointer; z-index: 4;
    box-shadow: 0 4px 14px rgba(0,0,0,.22);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; overflow: hidden; padding: 0;
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
    transition: transform .1s;
  }
  .center-btn img { width: 78%; height: 78%; object-fit: contain; pointer-events: none; }
  .center-btn span { line-height: 1; pointer-events: none; }
  .center-btn:active { transform: translate(-50%,-50%) scale(.94); }
  #result {
    min-height: 2.2em; margin: 14px 0 8px;
    font-size: clamp(16px,4vw,24px); font-weight: 700;
    color: #b23b3b; text-align: center;
    padding: 0 16px; line-height: 1.4;
    width: 100%; max-width: 92vw;
  }
  .sound-btn {
    margin-bottom: 10px;
    padding: clamp(6px,1.4vw,12px) clamp(16px,4vw,28px);
    border: 2px solid #e4b95b; border-radius: 40px;
    background: #fff; color: #8a6a20;
    font-size: clamp(14px,3vw,18px);
    cursor: pointer; -webkit-appearance: none; appearance: none;
    touch-action: manipulation; transition: opacity .2s; font-weight: 600;
  }
  .sound-btn.off { opacity: .5; text-decoration: line-through; }
  .tip {
    font-size: clamp(11px,2.4vw,14px);
    color: #8a7a66; margin: 2px 0 16px;
    text-align: center; padding: 0 16px;
    line-height: 1.4; max-width: 92vw;
  }
  @media (min-width: 768px) and (max-width: 1366px) {
    .wheel-wrap { width: min(80vw, 80vh, 700px); }
    h1 { margin: 8px 0 4px; }
    #result { margin: 10px 0 6px; }
  }
  @media (min-width: 768px) and (orientation: portrait) {
    .wheel-wrap { width: min(88vw, 70vh, 640px); }
  }
</style>
</head>
<body>

<h1>亲子养生 · 幸运轮盘</h1>

<div class="wheel-wrap">
  <canvas id="wheel" width="800" height="800"></canvas>
  <div class="pointer"></div>
  <button id="spinBtn" class="center-btn" aria-label="转动轮盘">
    <span>转</span>
  </button>
</div>

<div id="result">点击中间开始</div>
<button id="soundBtn" class="sound-btn">🔊 音效：开</button>
<div class="tip">6 个格子均匀，奖品轮流出现，中国结和纽扣结不会连续～</div>

<script>
(function(){
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const CANVAS_SIZE = 800;
  canvas.width = CANVAS_SIZE;
  canvas.height = CANVAS_SIZE;

  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('result');
  const soundBtn = document.getElementById('soundBtn');

  const prizes = [
    { name: '中国结手绳', color: '#F9D77E' },
    { name: '纽扣结手绳', color: '#F7A072' },
    { name: '再试一次',   color: '#FFC8DD' },
    { name: '亲子书签',   color: '#B8E0D2' },
    { name: '糖果',       color: '#CDB4DB' },
    { name: '小小礼品一份', color: '#A2D2FF' }
  ];
  const drawSequence = ['中国结手绳','小小礼品一份','纽扣结手绳','再试一次','糖果','亲子书签'];
  let seqIndex = 0;

  const n = prizes.length;
  const arc = Math.PI * 2 / n;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = Math.min(cx, cy) - 12;

  const sectors = prizes.map((p,i) => {
    const start = i * arc;
    const end = start + arc;
    return { ...p, start, end, mid: start + arc/2 };
  });

  function drawWheel(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    sectors.forEach(sec => {
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,sec.start,sec.end);
      ctx.closePath();
      ctx.fillStyle = sec.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(sec.mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#4a3520';
      const fontSize = Math.round(CANVAS_SIZE * 0.045);
      ctx.font = `bold ${fontSize}px "Microsoft YaHei","PingFang SC",sans-serif`;
      ctx.fillText(sec.name, r - 40, 0);
      ctx.restore();
    });
    ctx.beginPath();
    ctx.arc(cx,cy,r*0.13,0,Math.PI*2);
    ctx.fillStyle = '#fff8e7';
    ctx.fill();
    ctx.strokeStyle = '#e4b95b';
    ctx.lineWidth = 6;
    ctx.stroke();
  }
  drawWheel();

  let soundOn = true;
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  function playTick(){
    if(!soundOn) return; const ac=getAudioCtx(); if(!ac) return;
    try{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='square'; o.frequency.setValueAtTime(1500, ac.currentTime);
      g.gain.setValueAtTime(.06, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.04);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime+.05);
    }catch(e){}
  }
  function playWin(){
    if(!soundOn) return; const ac=getAudioCtx(); if(!ac) return;
    try{
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.value=f;
        const t=ac.currentTime+i*.11;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.2,t+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+.35);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t+.4);
      });
    }catch(e){}
  }
  function playRetry(){
    if(!soundOn) return; const ac=getAudioCtx(); if(!ac) return;
    try{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='triangle'; o.frequency.setValueAtTime(500,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(250,ac.currentTime+.4);
      g.gain.setValueAtTime(.15,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime+.42);
    }catch(e){}
  }
  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 音效：开' : '🔇 音效：关';
    soundBtn.classList.toggle('off', !soundOn);
    if(soundOn) getAudioCtx();
  });

  let spinning = false;
  let currentRotation = 0;
  let animationFrameId = null;

  function findSectorByName(name){ return sectors.find(s=>s.name===name); }
  function easeOut(t){ return 1-Math.pow(1-t,4); }
  function animateRotation(from,to,duration,onEnd){
    const startTime = performance.now();
    let lastSectorIndex = -1;
    function frame(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed/duration,1);
      const current = from + (to-from)*easeOut(t);
      canvas.style.transform = `rotate(${current}rad)`;
      let localAngle = (-Math.PI/2 - current) % (Math.PI*2);
      if(localAngle<0) localAngle += Math.PI*2;
      for(let i=0;i<sectors.length;i++){
        if(localAngle>=sectors[i].start && localAngle<sectors[i].end){
          if(i!==lastSectorIndex){ lastSectorIndex=i; playTick(); }
          break;
        }
      }
      if(t<1){ animationFrameId = requestAnimationFrame(frame); }
      else { animationFrameId=null; onEnd(); }
    }
    animationFrameId = requestAnimationFrame(frame);
  }
  function stopAnimation(){ if(animationFrameId){ cancelAnimationFrame(animationFrameId); animationFrameId=null; } }

  spinBtn.addEventListener('click', ()=>{
    if(spinning) return;
    getAudioCtx();
    spinning = true;
    resultEl.textContent = '转动中...';
    const targetName = drawSequence[seqIndex];
    seqIndex = (seqIndex+1) % drawSequence.length;
    const targetSector = findSectorByName(targetName);
    if(!targetSector){ spinning=false; return; }
    const targetCenter = targetSector.mid;
    const base = -Math.PI/2 - targetCenter;
    const currentMod = ((currentRotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    const targetMod = ((base % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    let delta = targetMod - currentMod;
    if(delta<0) delta += Math.PI*2;
    const extraTurns = Math.PI*2*(5+Math.floor(Math.random()*3));
    const finalRotation = currentRotation + extraTurns + delta;
    const duration = 5000;
    stopAnimation();
    animateRotation(currentRotation, finalRotation, duration, ()=>{
      spinning = false;
      currentRotation = finalRotation;
      if(targetSector.name==='再试一次'){
        resultEl.textContent = '抽中：再试一次，再点一次转盘吧！';
        playRetry();
      } else {
        resultEl.textContent = `抽中：${targetSector.name}`;
        playWin();
      }
    });
  });

  document.addEventListener('touchend', (e)=>{
    const now = Date.now();
    if(now - (window.__lastTouchEnd||0) <= 300) e.preventDefault();
    window.__lastTouchEnd = now;
  }, { passive: false });

  document.querySelector('.wheel-wrap').addEventListener('touchmove', e=>e.preventDefault(), { passive:false });
})();
</script>
</body>
</html>
