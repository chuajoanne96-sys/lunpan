<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>亲子养生 · 幸运轮盘</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #f7f1e3;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #4a3520;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 { font-size: clamp(20px,5vw,32px); margin: 12px 0 8px; letter-spacing: 2px; text-align: center; padding: 0 12px; }
  .wheel-wrap { position: relative; width: min(92vw,92vh,680px); aspect-ratio: 1/1; margin: 0 auto; touch-action: none; }
  #wheel { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,.18); transition: transform .04s linear; will-change: transform; }
  .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
    border-left: clamp(12px,2.8vw,22px) solid transparent;
    border-right: clamp(12px,2.8vw,22px) solid transparent;
    border-top: clamp(24px,5.5vw,42px) solid #d94f4f;
    z-index: 3; filter: drop-shadow(0 3px 3px rgba(0,0,0,.25)); pointer-events: none; }
  .center-btn { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 22%; aspect-ratio: 1/1; border-radius: 50%;
    border: clamp(3px,.8vw,6px) solid #fff; background: #ffd97a; color: #5a3a12;
    font-size: clamp(12px,2.6vw,20px); font-weight: 700; cursor: pointer; z-index: 4;
    box-shadow: 0 4px 14px rgba(0,0,0,.22);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    overflow: hidden; padding: 0; -webkit-appearance: none; appearance: none;
    touch-action: manipulation; transition: transform .1s; }
  .center-btn img { width: 75%; height: 75%; object-fit: contain; pointer-events: none; }
  .center-btn span { line-height: 1; pointer-events: none; }
  .center-btn:active { transform: translate(-50%,-50%) scale(.96); }
  #result { min-height: 2em; margin: 14px 0 8px; font-size: clamp(16px,4vw,24px); font-weight: 700; color: #b23b3b; text-align: center; padding: 0 12px; line-height: 1.4; max-width: 92vw; }
  .sound-btn { margin-bottom: 12px; padding: clamp(6px,1.4vw,12px) clamp(16px,4vw,28px);
    border: 2px solid #e4b95b; border-radius: 40px; background: #fff; color: #8a6a20;
    font-size: clamp(14px,3vw,18px); cursor: pointer; -webkit-appearance: none; appearance: none;
    touch-action: manipulation; font-weight: 600; transition: opacity .2s; }
  .sound-btn.off { opacity: .5; text-decoration: line-through; }
  .tip { font-size: clamp(11px,2.4vw,14px); color: #8a7a66; margin: 2px 0 16px; text-align: center; padding: 0 16px; line-height: 1.4; max-width: 92vw; }
  @media (min-width: 768px) and (max-width: 1366px) { .wheel-wrap { width: min(80vw,80vh,700px); } }
  @media (min-width: 768px) and (orientation: portrait) { .wheel-wrap { width: min(88vw,70vh,640px); } }
</style>
</head>
<body>

<h1>亲子养生 · 幸运轮盘</h1>

<div class="wheel-wrap">
  <canvas id="wheel" width="800" height="800"></canvas>
  <div class="pointer"></div>
  <button id="spinBtn" class="center-btn" aria-label="转动轮盘">
    <img src="bracelet.png" alt="手绳"
         onload="this.nextElementSibling.style.display='none'"
         onerror="this.style.display='none'">
    <span>转</span>
  </button>
</div>

<div id="result">点击中间开始</div>
<button id="soundBtn" class="sound-btn">🔊 音效：开</button>
<div class="tip">6 个格子均匀，奖品轮流出现，中国结和纽扣结不会连续～</div>

<script>
(function(){
  // ============================================================
  // 内嵌真实 WAV 音频（base64），不用 Web Audio API
  // tick  ：哒哒声
  // win   ：胜利音乐
  // retry ：再试一次音效
  // ============================================================

  // 哒哒声 (短促高频，约 0.07 秒)
  const TICK_B64 = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=";
  // 上面这个是占位，下面用 JS 动态生成真实数据
  // 我们改为页面加载时用 OfflineAudioContext 生成真实 WAV 并赋给 audio 标签

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const CANVAS_SIZE = 800;
  canvas.width = CANVAS_SIZE;
  canvas.height = CANVAS_SIZE;

  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('result');
  const soundBtn = document.getElementById('soundBtn');

  // ============ 音频生成（离线渲染成 WAV base64）============
  function audioBufferToWav(buffer) {
    const numChan = buffer.numberOfChannels;
    const len = buffer.length * numChan * 2 + 44;
    const arr = new ArrayBuffer(len);
    const view = new DataView(arr);
    const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    writeStr(0, 'RIFF');
    view.setUint32(4, len - 8, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChan, true);
    view.setUint32(24, buffer.sampleRate, true);
    view.setUint32(28, buffer.sampleRate * numChan * 2, true);
    view.setUint16(32, numChan * 2, true);
    view.setUint16(34, 16, true);
    writeStr(36, 'data');
    view.setUint32(40, len - 44, true);
    const channels = [];
    for (let i = 0; i < numChan; i++) channels.push(buffer.getChannelData(i));
    let offset = 44;
    for (let i = 0; i < buffer.length; i++) {
      for (let ch = 0; ch < numChan; ch++) {
        let s = Math.max(-1, Math.min(1, channels[ch][i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }
    }
    return arr;
  }

  function generateWavDataURI(type) {
    return new Promise(resolve => {
      try {
        const sampleRate = 22050;
        let length, notes;
        if (type === 'tick') {
          length = Math.floor(sampleRate * 0.07);
          notes = [{ f: 1400, t: 'square', vol: 0.35, start: 0, dur: 0.07 }];
        } else if (type === 'win') {
          length = Math.floor(sampleRate * 0.8);
          notes = [
            { f: 523.25, t: 'sine', vol: 0.5, start: 0.00, dur: 0.35 },
            { f: 659.25, t: 'sine', vol: 0.5, start: 0.12, dur: 0.35 },
            { f: 783.99, t: 'sine', vol: 0.5, start: 0.24, dur: 0.35 },
            { f: 1046.5, t: 'sine', vol: 0.5, start: 0.36, dur: 0.4  }
          ];
        } else {
          length = Math.floor(sampleRate * 0.5);
          notes = [{ f: 400, t: 'triangle', vol: 0.5, start: 0, dur: 0.45, sweep: 180 }];
        }

        const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        const offline = new OAC(1, length, sampleRate);

        notes.forEach(n => {
          const osc = offline.createOscillator();
          const gain = offline.createGain();
          osc.type = n.t;
          osc.frequency.setValueAtTime(n.f, n.start);
          if (n.sweep) {
            osc.frequency.exponentialRampToValueAtTime(n.sweep, n.start + n.dur);
          }
          gain.gain.setValueAtTime(0, n.start);
          gain.gain.linearRampToValueAtTime(n.vol, n.start + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, n.start + n.dur);
          osc.connect(gain);
          gain.connect(offline.destination);
          osc.start(n.start);
          osc.stop(n.start + n.dur + 0.02);
        });

        offline.startRendering().then(buffer => {
          const wav = audioBufferToWav(buffer);
          const blob = new Blob([wav], { type: 'audio/wav' });
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(blob);
        }).catch(() => resolve(null));
      } catch (e) {
        resolve(null);
      }
    });
  }

  // 创建 audio 元素
  const tickAudio  = new Audio();
  const winAudio   = new Audio();
  const retryAudio = new Audio();
  [tickAudio, winAudio, retryAudio].forEach(a => {
    a.preload = 'auto';
    a.setAttribute('playsinline', '');
    a.setAttribute('webkit-playsinline', '');
  });

  // 页面加载时生成音频数据
  (async () => {
    try {
      const [t, w, r] = await Promise.all([
        generateWavDataURI('tick'),
        generateWavDataURI('win'),
        generateWavDataURI('retry')
      ]);
      if (t) tickAudio.src  = t;
      if (w) winAudio.src   = w;
      if (r) retryAudio.src = r;
    } catch (e) {}
  })();

  // ============ 音效播放 ============
  let soundOn = true;

  function playAudio(el) {
    if (!soundOn || !el || !el.src) return;
    try {
      el.currentTime = 0;
      const p = el.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  const playTick  = () => playAudio(tickAudio);
  const playWin   = () => playAudio(winAudio);
  const playRetry = () => playAudio(retryAudio);

  // iOS 解锁：第一次触摸时，把所有音频都用静音方式播一次
  let audioUnlocked = false;
  function unlockAllAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    [tickAudio, winAudio, retryAudio].forEach(el => {
      if (!el || !el.src) return;
      try {
        el.muted = true;
        const p = el.play();
        if (p && p.then) {
          p.then(() => {
            el.pause(); el.currentTime = 0; el.muted = false;
          }).catch(() => { el.muted = false; });
        } else {
          el.pause(); el.currentTime = 0; el.muted = false;
        }
      } catch (e) { el.muted = false; }
    });
  }

  document.addEventListener('touchstart', unlockAllAudio, { passive: true });
  document.addEventListener('touchend',   unlockAllAudio, { passive: true });
  document.addEventListener('click',      unlockAllAudio, { passive: true });

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 音效：开' : '🔇 音效：关';
    soundBtn.classList.toggle('off', !soundOn);
    if (soundOn) unlockAllAudio();
  });

  // ============ 轮盘绘制 ============
  const prizes = [
    { name: '中国结手绳', color: '#F9D77E' },
    { name: '纽扣结手绳', color: '#F7A072' },
    { name: '再试一次',   color: '#FFC8DD' },
    { name: '亲子书签',   color: '#B8E0D2' },
    { name: '糖果',       color: '#CDB4DB' },
    { name: '小小礼品一份', color: '#A2D2FF' }
  ];
  const drawSequence = ['中国结手绳','小小礼品一份','纽扣结手绳','再试一次','糖果','亲子书签'];
  let seqIndex = 0;

  const n = prizes.length;
  const arc = Math.PI * 2 / n;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = Math.min(cx, cy) - 12;

  const sectors = prizes.map((p, i) => {
    const start = i * arc;
    const end = start + arc;
    return { ...p, start, end, mid: start + arc / 2 };
  });

  function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    sectors.forEach(sec => {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, sec.start, sec.end);
      ctx.closePath();
      ctx.fillStyle = sec.color;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(sec.mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#4a3520';
      const fontSize = Math.round(CANVAS_SIZE * 0.045);
      ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
      ctx.fillText(sec.name, r - 40, 0);
      ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.13, 0, Math.PI * 2);
    ctx.fillStyle = '#fff8e7';
    ctx.fill();
    ctx.strokeStyle = '#e4b95b';
    ctx.lineWidth = 6;
    ctx.stroke();
  }
  drawWheel();

  // ============ 旋转逻辑 ============
  let spinning = false;
  let currentRotation = 0;
  let animationFrameId = null;

  const findSectorByName = name => sectors.find(s => s.name === name);
  const easeOut = t => 1 - Math.pow(1 - t, 4);

  function animateRotation(from, to, duration, onEnd) {
    const startTime = performance.now();
    let lastSectorIndex = -1;

    function frame(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const current = from + (to - from) * easeOut(t);
      canvas.style.transform = `rotate(${current}rad)`;

      let localAngle = (-Math.PI / 2 - current) % (Math.PI * 2);
      if (localAngle < 0) localAngle += Math.PI * 2;

      for (let i = 0; i < sectors.length; i++) {
        if (localAngle >= sectors[i].start && localAngle < sectors[i].end) {
          if (i !== lastSectorIndex) {
            lastSectorIndex = i;
            playTick();
          }
          break;
        }
      }

      if (t < 1) {
        animationFrameId = requestAnimationFrame(frame);
      } else {
        animationFrameId = null;
        onEnd();
      }
    }
    animationFrameId = requestAnimationFrame(frame);
  }

  spinBtn.addEventListener('click', () => {
    if (spinning) return;

    // 关键：先解锁音频（在用户手势事件内）
    unlockAllAudio();

    spinning = true;
    resultEl.textContent = '转动中...';

    const targetName = drawSequence[seqIndex];
    seqIndex = (seqIndex + 1) % drawSequence.length;
    const targetSector = findSectorByName(targetName);
    if (!targetSector) { spinning = false; return; }

    const base = -Math.PI / 2 - targetSector.mid;
    const currentMod = ((currentRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const targetMod = ((base % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    let delta = targetMod - currentMod;
    if (delta < 0) delta += Math.PI * 2;
    const extraTurns = Math.PI * 2 * (5 + Math.floor(Math.random() * 3));
    const finalRotation = currentRotation + extraTurns + delta;
    const duration = 5000;

    if (animationFrameId) cancelAnimationFrame(animationFrameId);

    animateRotation(currentRotation, finalRotation, duration, () => {
      spinning = false;
      currentRotation = finalRotation;
      if (targetSector.name === '再试一次') {
        resultEl.textContent = '抽中：再试一次，再点一次转盘吧！';
        playRetry();
      } else {
        resultEl.textContent = `抽中：${targetSector.name}`;
        playWin();
      }
    });
  });

  // 防止双击缩放与滑动
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - (window.__lastTouchEnd || 0) <= 300) e.preventDefault();
    window.__lastTouchEnd = now;
  }, { passive: false });

  document.querySelector('.wheel-wrap').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
})();
</script>

</body>
</html>
